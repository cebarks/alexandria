[package]
name = "granite-artifact"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
burn-onnx = { version = "=0.22.0", default-features = false, features = ["import", "mmap"] }
burn-pack = { version = "=0.22.0", default-features = false, features = ["std"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
