[graph]
targets = []
all-features = true

[advisories]
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # Marvin Attack timing sidechannel in `rsa` crate — no upstream fix available.
    # Transitive dep via surrealdb -> jsonwebtoken -> rsa. We don't use RSA directly.
    "RUSTSEC-2023-0071",
    # Two quick-xml 0.39.4 denial-of-service bugs: quadratic duplicate-attribute checking
    # (RUSTSEC-2026-0194) and unbounded `NsReader` namespace allocation (RUSTSEC-2026-0195).
    # Transitive via surrealdb-core 3.3 -> object_store 0.13, which surrealdb-core builds with its
    # cloud backends on and no feature to drop them. Fixed in quick-xml 0.41, which object_store
    # 0.13 cannot take. We never configure object storage, so that XML parser never runs.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # Data race / double free via unsound Send/Sync in reblessive 0.4.3, reachable through
    # surrealdb-core 3.3.0's dbs::Executor. No fix in the 3.3 line — patched in surrealdb-core
    # 4.0.0. Tracked by the SurrealDB 4 upgrade: https://github.com/cebarks/alexandria/issues/55
    "RUSTSEC-2026-0454",
    # Out-of-bounds read decoding internal keys shorter than 16 bytes in surrealkv 0.21.4,
    # reachable at the on-disk SSTable decode boundary. Fixed in surrealkv 1.2.0, which only
    # ships with SurrealDB 4.0.0. Tracked by the SurrealDB 4 upgrade:
    # https://github.com/cebarks/alexandria/issues/55
    "RUSTSEC-2026-0452",
    # Explicitly accepted risk, NOT a crypto fix: official SurrealDB 4.0.1 pins
    # JWT 10.4, whose WASM rust_crypto backend retains crypto-bigint 0.5.5.
    # The inspected native Linux 4.0.1 graph uses AWS-LC instead. Reconsider if
    # WASM support is introduced or this path becomes native; remove when the
    # official dependency route admits patched crypto. See docs/dependency-advisories.md.
    "RUSTSEC-2026-0387",
    # Temporary maintenance-risk acceptance, not dependency remediation.
    # Remove both ignores after https://github.com/cebarks/alexandria/issues/57
    # replaces the direct dependencies and the full audit passes without them.
    "RUSTSEC-2026-0543", # chrono
    "RUSTSEC-2026-0555", # chrono-tz
]

[licenses]
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# SurrealDB and its internal crates use BUSL-1.1 (Business Source License).
# We consume it as a library dependency, not as a competing service.
exceptions = [
    { allow = ["BUSL-1.1"], crate = "surrealdb" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-catalog" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-cnf" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-collections" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-common" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-core" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-datastore" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-engine-api" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-engine-local" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-expr" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-iam" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-idx" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-keyspace-macro" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-kvs" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-kvs-any" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-kvs-mem" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-kvs-surrealkv" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-observe" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-parse-common" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-parser-next" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-stored-derive" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-protocol" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-rpc" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-runtime" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-sql" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-strand" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-syn" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-types" },
    { allow = ["BUSL-1.1"], crate = "surrealdb-types-derive" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
