# yamllint disable rule:line-length
# Pinned actions carry a full 40-char commit SHA plus the `# vN` annotation that
# Dependabot itself writes. Those lines cannot be wrapped (`uses:` has to stay a
# single scalar) and shortening them would weaken the pin or fight Dependabot's
# own formatting, so line-length is exempted for this file only.
---
name: CI

on:
  push:
    branches: [main]
  # `pull_request:` is deliberately unfiltered. The branch-protection ruleset requires status
  # checks on *every* ref (`ref_name: {include: ["~ALL"]}`), so a PR based on another feature
  # branch still has to be able to produce them; scoping this to `main` left stacked PRs with no
  # runs at all and `mergeStateStatus=BLOCKED` on "no checks reported" -- unmergeable however
  # green the code. `push:` stays main-only, and container.yml keeps its own filter: that workflow
  # is a cold uncached release build of the whole workspace, so every stacked PR touching Cargo.*
  # or crates/** would pay minutes for a check the merge into main runs anyway.
  #
  # No `types:`, so the defaults (opened, synchronize, reopened). A base retarget emits only
  # `edited`, which is not a default and would also fire on every title/body tweak at a full
  # five-job run each; when a retarget needs to wake CI, `gh pr close` then `gh pr reopen`.
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - run: just fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - run: just lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      # Runs before `just test`: the `immutable` asset cache header is only safe
      # because SHA256SUMS pins bytes to filename, and that link is not checked
      # anywhere else.
      - run: just verify-assets
      - run: just test

  # The pi companion is TypeScript with its own suite, and nothing else in this
  # workflow would notice if it stopped compiling: `just test` is cargo-only. It is
  # also the only client that consumes reminders, so a broken type there is a broken
  # delivery path for every user of the extension.
  extension:
    name: Pi companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contrib/pi/extensions/alexandria/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: contrib/pi/extensions/alexandria
      - name: Type-check
        run: npm run typecheck
        working-directory: contrib/pi/extensions/alexandria
      - name: Tests
        run: npm test
        working-directory: contrib/pi/extensions/alexandria

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
