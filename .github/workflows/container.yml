# yamllint disable rule:line-length
# Pinned actions carry a 40-char SHA plus Dependabot's `# vN` annotation; that
# line cannot wrap and shortening it would weaken the pin.
---
name: Container

# A separate workflow, not a fifth job in ci.yml: `paths:` filters apply to the
# whole workflow, so putting them in ci.yml would skip fmt/clippy/test on every
# docs-only push. It also leaves ci.yml's pins untouched, so an in-flight
# Dependabot bump cannot collide with this file.
on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/scripts/container-smoke.py
      - .github/workflows/container.yml
  pull_request:
    branches: [main]
    paths:
      - Containerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/scripts/container-smoke.py
      - .github/workflows/container.yml

permissions:
  contents: read

env:
  IMAGE: alexandria:ci

jobs:
  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # ubuntu-latest ships Docker 28 + buildx 0.36 preinstalled, so this needs no
      # third-party action. The image compiles the workspace in release mode, so
      # this step dominates the job's runtime.
      #
      # -f is not optional: unlike buildah/podman, Docker only looks for a file
      # literally named "Dockerfile" in the context root, so without it the build
      # dies in under a second with `failed to read dockerfile: open Dockerfile:
      # no such file or directory`.
      - name: Build image
        run: docker build -f Containerfile -t "$IMAGE" .

      # Start the actual entrypoint with valid hosted configuration and a fresh
      # named volume. Probe health and auth over the private backend HTTP leg.
      - name: Hosted boot and MCP authentication smoke
        timeout-minutes: 10
        run: python3 -I -B .github/scripts/container-smoke.py "$IMAGE"
