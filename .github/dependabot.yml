---
version: 2

updates:
  # Actions are pinned to full commit SHAs in ci.yml, which is the right hygiene
  # but means a pin that upstream moves or prunes silently red-lines every job.
  # This surfaces those as bump PRs instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait past Dependabot's 3-day default before opening a bump PR, so a newly
    # published action release has time to be flagged before we auto-consume it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    target-branch: main

  # The pi companion's npm deps. `@earendil-works/pi-coding-agent` is deliberately
  # exact-pinned: it is the API the extension type-checks against, so a bump must be a
  # reviewed change rather than background drift. `increase` is what preserves that —
  # it rewrites the constraint to the new version verbatim. The default (`auto`)
  # treats a library-like package as `widen`, which would turn `0.99.1` back into a
  # range and undo the pin. Check the host pi version before merging one of these.
  - package-ecosystem: npm
    directory: /contrib/pi/extensions/alexandria
    versioning-strategy: increase
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(pi)'
    target-branch: main
