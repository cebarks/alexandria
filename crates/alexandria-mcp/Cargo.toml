[package]
name = "alexandria-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
alexandria-storage = { path = "../alexandria-storage" }
surrealdb = { workspace = true }
alexandria-engine = { path = "../alexandria-engine" }
alexandria-pipeline = { path = "../alexandria-pipeline" }
serde = { workspace = true }
async-trait = { version = "0.1", default-features = false }
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
rmcp = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "json", "query"] }
# The already-resolved tokio-util, for the single type a credential lease is built on:
# `sync::CancellationToken`. No feature is requested because 0.7.20 has none to request — `sync` is an
# unconditional module there, and naming it as a feature fails to resolve — and `default-features = false`
# keeps `rt`, `codec` and the rest of the tree's optional surface out of this crate. The async runtime
# stays the binary's. No package enters the lock: verify with `grep -c '^name = ' Cargo.lock` = 1026.
tokio-util = { version = "0.7", default-features = false }
askama = { workspace = true }
# Reuse pipeline's already-locked reqwest 0.13.5 and Rustls feature. This edge adds no
# package (1026 lock entries before/after) or features; the adapter must explicitly
# disable system proxies because pipeline enables `system-proxy` on the shared crate.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
tokio = { workspace = true, features = ["io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-subscriber = { workspace = true }
