[package]
name = "alexandria-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
alexandria-storage = { path = "../alexandria-storage" }
surrealdb = { workspace = true }
alexandria-engine = { path = "../alexandria-engine" }
alexandria-pipeline = { path = "../alexandria-pipeline" }
serde = { workspace = true }
async-trait = { version = "0.1", default-features = false }
chrono = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
rmcp = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "json", "query"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
