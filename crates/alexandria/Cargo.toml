[package]
name = "alexandria"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
alexandria-storage = { path = "../alexandria-storage" }
alexandria-engine = { path = "../alexandria-engine" }
alexandria-pipeline = { path = "../alexandria-pipeline" }
alexandria-mcp = { path = "../alexandria-mcp" }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
rmcp = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

[dev-dependencies]
chrono = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
# The dreaming CLI is tested against a real on-disk SurrealKV store, because the single-writer
# refusal it reports only exists on the file-backed path: a second `mem://` handle is a different
# database. Same spelling as the other two crates that open disk stores.
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
