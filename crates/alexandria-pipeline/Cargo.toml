[package]
name = "alexandria-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
granite-vulkan = ["burn/vulkan", "burn/fusion", "burn/autotune"]
granite-rocm = ["burn/rocm", "burn/fusion", "burn/autotune"]

[dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["std", "flex", "simd", "rayon"] }
burn-store = { version = "=0.22.0", default-features = false, features = ["std", "memmap"] }
alexandria-storage = { path = "../alexandria-storage" }
alexandria-engine = { path = "../alexandria-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
dirs = { workspace = true }
async-trait = { version = "0.1", default-features = false }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
tempfile = { version = "3", default-features = false, features = ["getrandom"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
