[workspace]
resolver = "2"
members = [
  "crates/alexandria",
  "crates/alexandria-storage",
  "crates/alexandria-engine",
  "crates/alexandria-pipeline",
  "crates/alexandria-mcp",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
debug = false
strip = true

[profile.dev]
opt-level = 1
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
  "net",
] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Embedded-only: add "protocol-ws" and "rustls" if SurrealDB is ever not on localhost.
surrealdb = { version = "3.2", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
rmcp = { version = "3.1", default-features = false, features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
  "macros",
  "schemars",
] }
schemars = { version = "1", default-features = false, features = ["std", "derive"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "std",
  "fmt",
  "ansi",
  "tracing-log",
] }
thiserror = { version = "2", default-features = false, features = ["std"] }
anyhow = { version = "1", default-features = false, features = ["std"] }
dirs = { version = "7", default-features = false }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", default-features = false, features = ["std", "v4", "serde"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
tokenizers = { version = "0.22", default-features = false }
