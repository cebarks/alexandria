[workspace]
resolver = "2"
members = [
  "crates/alexandria",
  "crates/alexandria-storage",
  "crates/alexandria-engine",
  "crates/alexandria-pipeline",
  "crates/alexandria-mcp",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
debug = false
strip = true

[profile.dev]
opt-level = 1
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "3.2", features = ["kv-mem", "kv-surrealkv"] }
rmcp = { version = "3.1", features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
  "macros",
  "schemars",
] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"
dirs = "7"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.23"
